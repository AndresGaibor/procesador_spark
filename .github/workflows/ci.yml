name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run ruff check
        run: ruff check motor.py motor_spark tests

      - name: Run ruff format check
        run: ruff format --check motor.py motor_spark tests

      - name: Run tests
        run: pytest -q --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/motor-spark-wheel-check
          /tmp/motor-spark-wheel-check/bin/python -m pip install --upgrade pip
          /tmp/motor-spark-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/motor-spark-wheel-check/bin/python -c "import motor_spark; print('PACKAGE_OK')"

  compose:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          POSTGRES_PASSWORD=test docker compose -f tests/infra/docker-compose.dataflow.yml config --quiet
