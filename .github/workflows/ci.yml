name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" 2>/dev/null || pip install -e .
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Check for ruff
        id: ruff_available
        run: |
          if pip show ruff > /dev/null 2>&1 || grep -q "ruff" pyproject.toml requirements-dev.txt 2>/dev/null; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Run ruff check
        if: steps.ruff_available.outputs.available == 'true'
        run: ruff check .

      - name: Run ruff format check
        if: steps.ruff_available.outputs.available == 'true'
        run: ruff format --check .

      - name: Run tests
        run: pytest -q --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Verify package
        run: |
          pip install dist/*.tar.gz
          pip install dist/*.whl
          python -c "import motor_spark; print('OK')"

  compose:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          POSTGRES_PASSWORD=test docker compose -f tests/infra/docker-compose.dataflow.yml config --quiet
