[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-spark-recetas"
version = "0.1.0"
description = "Motor PySpark dirigido por recetas JSON"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3",
  "pyspark",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "spark: requiere PySpark y Java",
  "servidor: requiere el entorno Linux del Remote Engine",
]

[tool.coverage.run]
source = ["motor_spark"]
omit = ["tests/*"]

[tool.setuptools.packages.find]
include = ["motor_spark*"]
exclude = ["legacy*", "tests*", "docs*"]
namespaces = false
