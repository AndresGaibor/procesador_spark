[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-spark-recetas"
version = "0.1.0"
description = "Motor PySpark dirigido por recetas JSON"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3",
  "pyspark",
  "lark>=1.0",
  "paramiko>=3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "spark: requiere PySpark y Java",
  "servidor: requiere el entorno Linux del Remote Engine",
]

[tool.coverage.run]
source = ["motor_spark"]
omit = ["tests/*"]


[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
include = ["motor_spark*"]
exclude = ["legacy*", "tests*", "docs*"]
namespaces = false

[tool.ruff]
extend-exclude = ["legacy", ".venv", "dist", "build"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017", "RUF012", "SIM117"]
